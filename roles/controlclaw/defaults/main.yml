# Automatic updates stay within these package lines.
docker_major: "29"
containerd_major: "2"
openclaw_auto_patch: true

# Team chat on the firewall (tasks/teamchat.yml, controlclaw apps/saas/docs/features/team-chat.md).
# ClickClack (github.com/openclaw/clickclack, MIT), pinned by version and by the sha256 of each
# architecture's release archive (from that release's sha256sums.txt). The pin fixes the major and
# minor version: with clickclack_auto_patch on, the newest patch release of 0.7 is installed on
# every run of the role (a new box, an Update, the nightly maintenance window), verified against
# its own release's checksums, and anything else falls back to this exact release. Moving to 0.8
# or 1.x is a change to this file.
clickclack_version: "0.7.0"
clickclack_sha256:
  amd64: "1a5b0d14885be75602ca213689735a90e7369019ad98e5e8af3cb501964649ee"
  aarch64: "1e45c35739f7e3603dcaaea1924efc9400d75896e5077ab15d5a6b87d0f9994f"
clickclack_auto_patch: true
clickclack_arch: "{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
clickclack_lib_dir: /usr/local/lib/clickclack
# ClickClack listens on loopback (3931; 8080 is the egress proxy). Agents reach it through the
# mitm-agent's chat gate on the private address.
clickclack_port: 3931
teamchat_gate_port: 3930
# ControlClaw tools for agents (controlclaw docs/plans/controlplane-mcp.md §5): the mitm-agent's
# gate on the private address that signs each agent's call to the control plane's agent MCP.
controlplane_mcp_gate_port: 3940
