---
# ControlClaw default variables

# CI testing mode - skips tasks that require systemd, Docker-in-Docker, or kernel access
ci_test: false

# The first-boot fast path (tasks/fast-path.yml). Both default to "run everything": a play that
# never reaches that file, or one where anything about the base image could not be read, behaves
# exactly as it did before the fast path existed. fast-path.yml is the only thing that sets them.
cc_fast_path: false
cc_skip: {}

# Residential exit relay (box_role=exit-relay). The secrets have NO defaults on purpose: the role
# asserts them and refuses rather than building a relay that cannot verify a token or report a
# byte. Terraform passes them all (controlclaw repo, infra/exit-relay.tf).
exit_relay_port: 8443
exit_relay_acme_email: "ops@controlclaw.com"
exit_relay_upstream_host: "proxy.apify.com"
exit_relay_upstream_port: 8000
exit_relay_upstream_groups: "RESIDENTIAL"
exit_relay_id: "relay-1"

# /etc/letsencrypt lives on a Hetzner volume that outlives the server, because every relay setting
# travels in user_data and so every settings change replaces the box — and Let's Encrypt issues only
# five certificates a week for the same name. Empty means no volume: the role then leaves
# /etc/letsencrypt on the server's own disk, which is what the relay did before the volume existed
# and what any box built without one still does. Terraform passes the volume id (infra/exit-relay.tf).
exit_relay_cert_volume_id: ""
exit_relay_cert_volume_fstype: "ext4"

# Hetzner exposes an attached volume under a path built from its id. Derived rather than passed so
# Terraform only has to hand over the id.
exit_relay_cert_volume_device: "/dev/disk/by-id/scsi-0HC_Volume_{{ exit_relay_cert_volume_id }}"

# Further names the one certificate must also cover. exit.<domain> alone ran into Let's Encrypt's
# weekly limit, so the live certificate covers exit2.<domain> as well and the relay answers on
# either. They share a lineage named after exit_relay_host, so the paths below do not move.
# Note the trade-off: one certificate covering several names means certbot validates all of them in
# one order, so a name in this list that does NOT resolve to this box fails the order and the relay
# gets no certificate for the primary name either. Only put names here that point at this relay.
exit_relay_extra_hosts: []

# Where certbot keeps the lineage this relay reads. --cert-name pins it to exit_relay_host, so
# adding a name to the certificate does not move the PEM files the unit points at.
exit_relay_cert_live_dir: "/etc/letsencrypt/live/{{ exit_relay_host }}"

# Ask Let's Encrypt's staging CA instead of the real one. Staging certificates are not trusted by
# anything, so this is for tests of this role on throwaway boxes only — it is what lets a test prove
# the volume keeps a certificate without spending one of the five. Production is the default.
exit_relay_acme_staging: false

# Re-issue when the certificate on the volume has less than this long to run. Below it the role
# calls certbot; above it the volume's certificate is used as it is and nothing touches ACME.
exit_relay_cert_renew_days: 30

# Tailscale settings
tailscale_enabled: false
tailscale_authkey: ""

# Node.js version
# OpenClaw requires node >=24.16.0 (<25) or >=26.1.0. npm resolves `openclaw@latest`
# against the installed node, so an older node silently installs an older OpenClaw.
nodejs_version: "24.x"

# User settings (will be created as system user)
controlclaw_user: controlclaw
controlclaw_home: /home/controlclaw

# SSH keys for controlclaw user
controlclaw_ssh_keys: []

# The live browser: one headful Chrome on a virtual display, shown in the console over noVNC and
# driven by OpenClaw over CDP. On for every agent box — a customer's saved logins live in that
# Chrome profile and the agent reuses them, so there is nothing to opt into.
#
# It is a default rather than a per-box flag on purpose: cc-reprovision rebuilds its extra-vars
# from what is on disk (files/cc-reprovision), so a flag the control plane passed at create time
# would be lost on the first self-update. The variable stays so a box can still be built without
# the browser (CI, the proxy/mitm roles do not include this file at all).
#
# All three ports are loopback-only; Caddy is the one way in (templates/Caddyfile.j2).
browser_stream_enabled: true
browser_cdp_port: 9222
browser_vnc_port: 5900
browser_novnc_port: 6080

# The virtual screen. One value: the script sizes Xvfb and the Chrome window from it, so they
# cannot drift apart and leave a border of dead space around the window.
browser_screen_geometry: "1280x800"

# OpenClaw's own Systems tab, pointed at that same screen.
#
# The gateway reports a desktop for its host when `desktop.host.enabled` is true, and observing
# it means attaching to a loopback VNC server — which OpenClaw REFUSES to do unless the server
# asks for a password ("refusing unauthenticated VNC server"). The console's mirror on
# browser_vnc_port has no password and must not grow one: noVNC would start prompting the
# customer in the Browser tab. So browser-stream.sh runs a SECOND x11vnc over the same display
# :1, password-protected, on this port, and OpenClaw is pointed at that one. The console's path
# is left exactly as it was.
#
# Cost: one more x11vnc inside the browser cgroup's MemoryMax -- 15 MB resident, measured on a
# real box. Both mirrors show the same screen; neither can see anything the other cannot.
openclaw_desktop_enabled: true
browser_desktop_vnc_port: 5901
# Plaintext, read by OpenClaw as the controlclaw user at observe time (desktop.host.passwordFile)
# and handed to the control-UI client that already authenticated to the gateway.
openclaw_desktop_password_file: /opt/controlclaw/keys/desktop_vnc_password
# The same password in x11vnc's obfuscated -rfbauth format. Two files because the two programs
# read two formats; generated together, once, and never rotated.
browser_desktop_rfbauth_file: /opt/controlclaw/keys/desktop_vnc_rfbauth

# What the browser cgroup is allowed. A browser's appetite is set by whatever page someone opens,
# and it shares a 4 GB box with the agent, so it is capped rather than left to the OOM killer's
# judgement — which in practice takes OpenClaw and leaves the browser looking fine. MemoryHigh
# throttles it into swap first; MemoryMax is the wall. Covers Chrome, Xvfb, x11vnc, websockify
# and openbox together (~220 MB of that is everything except Chrome).
#
# A share of the box's memory (of MemTotal, which is a little under the plan's figure), worked out
# by systemd when it loads the unit, so a box that is resized gets the new figure on its next boot.
# They used to be 1600M and 2G whatever the size, and no box may get less than that: a 4 GB box
# has about 3.8 GiB, where these come to 1.6 GiB and 2.05 GiB. On a cpx32 (8 GB, about 7.6 GiB)
# with 30 tabs of busy sites the old limit had Chrome 1.5 GB into swap and its calls taking 4 to
# 8 s while 4 GB of the box sat free (T-browserhang); there these are 3.2 GiB and 4.1 GiB.
browser_memory_high: "42%"
browser_memory_max: "54%"

# What OpenClaw is pointed at (tasks/openclaw.yml). Written into the config AND compared against
# what is already there, so it is derived once here rather than spelled out twice.
openclaw_cdp_url: "http://127.0.0.1:{{ browser_cdp_port }}"

# OpenClaw drives that Chrome with playwright-core, which announces itself on the CDP wire:
# it turns the Runtime domain on for every page it attaches to, and injects its init scripts
# into the page's own JS world. patchright-core is the same Playwright release with those
# removed, and the same package layout, so tasks/openclaw.yml points OpenClaw's
# `playwright-core` at it instead of replacing any OpenClaw code.
#
# The version must be the playwright-core version OpenClaw itself depends on — patchright
# publishes a build per Playwright release (not for every one of them), and the two are the same
# API only at the same number. openclaw.yml reads OpenClaw's own dependency and, when they
# differ, skips the alias and warns rather than failing the play: `openclaw@latest` is unpinned,
# so a hard stop would take every provisioning box down over a fingerprint. Bumping this is the
# chore that comes with an OpenClaw release that moves Playwright.
patchright_version: "1.63.0"
# Deliberately NOT under /opt/controlclaw: OpenClaw resolves this path as the controlclaw user,
# and that tree is 0750/0700 root-owned in places (it holds keys/). A box where the gateway
# cannot traverse to the package loses its browser tool entirely — seen on a real box before
# this moved. /usr/local/lib is where a locally installed library belongs anyway.
patchright_prefix: /usr/local/lib/controlclaw-patchright

# Web search (tasks/openclaw-search.yml). `web_search` needs a provider named in the config:
# OpenClaw only auto-detects providers that already hold a credential, and none of the models
# this platform ships carries one, so out of the box the tool answers "web_search is disabled or
# no provider is available".
#
# parallel-free is Parallel's free Search MCP — no key, no account, one host
# (search.parallel.ai:443). duckduckgo is installed alongside it but NOT selected: it is a
# config switch away when Parallel is rate limiting, without needing npm on a confined box.
#
# The version is pinned rather than tracking @latest: both packages declare
# `peerDependencies.openclaw: ">=2026.9.5"`, so a newer gateway is happy with this pin and two
# boxes built an hour apart get the same plugin. Bump it when an OpenClaw release raises the
# plugin API floor — the same chore patchright_version carries.
openclaw_web_search_provider: parallel-free
openclaw_search_plugin_version: "2026.9.5"
#
# tavily and brave are the PAID providers an organisation can switch to from the console
# (controlclaw apps/saas/docs/features/web-search.md). The key never reaches this box — the org
# firewall holds it and pushes a placeholder plus `tools.web.search.provider` — but the plugin
# behind the provider has to be here first, so both are installed on every agent box whether or
# not the organisation has a key. An unconfigured plugin does nothing, and installing on demand
# would make somebody's first search change wait on npm (and hang behind the proxy on a confined
# box): `packages/vm-agent/src/search.ts` refuses the change rather than fetching anything.
openclaw_search_plugins:
  - { id: parallel, package: "@openclaw/parallel-plugin" }
  - { id: duckduckgo, package: "@openclaw/duckduckgo-plugin" }
  - { id: tavily, package: "@openclaw/tavily-plugin" }
  - { id: brave, package: "@openclaw/brave-plugin" }
# The ones that need a key. Left `enabled: false` unless they are the provider in use
# (tasks/openclaw-search.yml); the same list as SEARCH_PLUGINS in the vm-agent's search.ts.
openclaw_search_keyed_plugins: [tavily, brave]

# Swap (tasks/swap.yml). The stock box has none, which leaves the kernel no move under memory
# pressure except to kill something. 0 disables.
swap_size_mb: 4096
swap_file: /swapfile

# Google Drive folders mounted into the agent's workspace (controlclaw docs/plans/drive-folders.md).
#
# rclone is pinned by version AND sha256, and installed from downloads.rclone.org rather than apt:
# Ubuntu 24.04 ships a much older rclone than the flags here need, and an unpinned download is a
# supply chain nobody reviewed. Bump the version and both checksums together, the way
# connector_image_digest is bumped. `curl -sSL https://downloads.rclone.org/vX.Y.Z/SHA256SUMS`.
rclone_version: "1.75.1"
rclone_sha256_amd64: "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"
rclone_sha256_arm64: "03f2504174034b6d004152ed7369251c9a9ec1f7e0836eda420f5c7a5ec0dff9"

# The organisation's own Google account, spent by `gog` on this box (controlclaw
# docs/plans/google-account.md). What is installed here is inert: a pinned binary, a wrapper and an
# empty directory. Nothing works until the org firewall pushes a placeholder to the vm-agent, which
# verifies the firewall's signature and writes the environment file the wrapper reads.
#
# **No Google credential ever lands here.** `GOG_ACCESS_TOKEN` holds a placeholder the firewall
# generated; the org proxy swaps it for a real access token on *.googleapis.com, for this box only.
# There is no keyring, no credentials.json and nothing in GOG_HOME — with a direct token `gog`
# short-circuits before it looks for any of them.
#
# Pinned by version AND sha256, from the GitHub release rather than `go install` or a script: an
# unpinned download is a supply chain nobody reviewed. Bump the version and both checksums together,
# the way rclone_version is bumped. `curl -sSL
# https://github.com/openclaw/gogcli/releases/download/v<X.Y.Z>/checksums.txt`.
gog_version: "0.41.0"
gog_sha256_amd64: "bfdb7e67c904098a34a54eb2ae2b1874c41eda7defd7182e5f2c89a2c2ba44c3"
gog_sha256_arm64: "a226c1f439f16e946d8d5b73b49da8e65875978adb65d6bc23e7e225e799e966"
# The real binary. /usr/local/bin/gog is a wrapper in front of it (files/cc-gog), so `gog` on PATH
# picks up a changed placeholder on the very next command with nothing restarted.
gog_real_bin: /usr/local/lib/controlclaw/gog
# The 1Password CLI on the firewall, for website logins read from a 1Password vault (controlclaw
# docs/plans/website-credentials.md). Checksums of the release zips from cache.agilebits.com.
op_cli_version: "2.40.0"
op_cli_sha256_amd64: "74277219e8da60958c00f9aee9d2023225e98fdda8bfd2156a5d9e85e0edaab3"
op_cli_sha256_arm64: "0e8ac99ee93d661aa725dc24a5ef8bf344741d224064a5dfb469dc689faec86a"
# gog's config, data, state and cache. Deliberately NOT under the agent's home: a cache that turned
# up in the workspace would show in the console's Files page and in a workspace backup.
gog_home: /opt/controlclaw/gog
# Where the vm-agent writes the environment file the wrapper sources. Inside the agent's own state
# directory, which it already owns, so applying a grant needs no root.
gog_env_file: /opt/controlclaw/state/gog.env

# Per-mount rclone configs, env files and VFS caches. Deliberately NOT under the workspace: the
# agent must not be able to rewrite the config of its own mounts, and the cache must not show up in
# the file explorer or in a workspace backup.
drive_state_dir: /opt/controlclaw/drive
# Where the folders appear. Inside OpenClaw's workspace, because that is the directory the agent
# works in and the one the console's Files page opens on.
drive_mount_root: "{{ controlclaw_home }}/.openclaw/workspace/Drive"
# First loopback port for a mount's rclone remote-control listener. One per mount, allocated in
# order by cc-drive-apply; the vm-agent reads the allocation out of the state file it writes.
drive_rc_base_port: 5700

# Box role: "openclaw" (agent zone, default), "proxy" (blind L4 proxy in front of the agents),
# "mitm" (secret zone — egress proxy + secrets) or "gbrain" (the org's shared GBrain, see below).
box_role: openclaw

# Which roles get Docker. Derived once here rather than spelled out per task: the install and the
# UFW/daemon.json wiring that goes with it have to agree about it, and when they did not, a relay
# box wrote /etc/docker/daemon.json, notified the restart handler and the play ended
# `Could not find the requested service docker: host` — after the relay itself was already up, so
# the failure looked like a relay problem and was not one.
controlclaw_uses_docker: "{{ box_role not in ['proxy', 'exit-relay', 'gbrain'] }}"

# Open TCP 22 in UFW, and leave the box's own SSH alone. Mirrors the Hetzner firewall flag
# (agent_ssh_debug in Terraform), which is the first gate; this keeps the box consistent if that
# firewall is ever detached.
#
# FALSE by default, because a box nobody has a key to should not be reachable on 22 by accident. With
# it false, ssh-lockdown.yml also empties root's authorized_keys, sets PermitRootLogin and
# PasswordAuthentication to no, and locks root's password. The control plane passes `ssh_debug: true`
# for dev boxes (AGENT_SSH_DEBUG in apps/saas), and Terraform passes it for the proxy and the relay
# (var.agent_ssh_debug).
#
# A consent-coded rescue grant does NOT need this: `cc-ssh-open` adds its own UFW rule and the key
# goes to the controlclaw user, which the lockdown deliberately leaves alone. See ssh-access.yml.
ssh_debug: false

# OpenClaw gateway. Loopback-only by design; Caddy terminates TLS on 443 in front of it and the
# proxy box is the only allowed source. The systemd unit is named `openclaw` because that is
# what the vm-agent drives; do not rename it without changing vm-agent's SERVICE constant.
openclaw_gateway_port: 18789

# Agent hostname and access path (openclaw boxes). vm_hostname is passed per box by the
# control plane (<slug><vm_domain_suffix>); without it Caddy is installed but not configured.
vm_domain_suffix: ".vm.controlclaw.com"
proxy_ip: ""                          # public IP of the proxy box; UFW allows 80/443 from it only
caddy_acme_email: "ops@controlclaw.com"

# On-demand re-provisioning (self-update.yml). The control plane passes the repo and branch it
# provisioned this box from; cc-reprovision then reads them off disk instead of being told at
# update time, so a compromised control plane cannot redirect a running box at its own repo.
# Empty repo = no pin written and the box simply has no update path.
ansible_repo_url: ""
ansible_branch: "main"
# Pull branch HEAD instead of the newest commit at least 24h old. For testing an update before
# the repo has branch protection and a review rule behind it; leave false in production.
update_allow_unverified: false

# Proxy box (box_role=proxy)
hcloud_read_token: ""                 # READ-ONLY Hetzner token for route discovery
proxy_routes_interval_sec: 20
# Every domain the proxy routes, besides vm_domain_suffix (which boxes without a cc-domain label
# use). A box's cc-domain label must name one of these or its route is dropped. One entry per
# domain, as a mapping so a per-domain option can be added without changing the shape, e.g.
#   proxy_domain_suffixes: [{ suffix: "ccl.bot" }]
proxy_domain_suffixes: []

# mitm box settings (secret zone)
mitm_proxy_port: 8080
mitm_agent_port: 3100
mitm_private_subnet: "10.0.0.0/16"   # the org private network CIDR
mitm_public_iface: eth0              # public interface to masquerade out of
controlclaw_url: ""                  # ControlClaw base URL (store/rules/permission endpoints)
org_id: ""                           # org this box serves

# Encrypted backups: the object store agent boxes PUT ciphertext to. Passed through the proxy
# uninspected: the body is already encrypted end to end and the authorisation is in the URL.
# Scoped to this one host. Empty disables it, which turns backups off for every box behind
# this firewall. See apps/saas/docs/features/backups.md.
controlclaw_backup_host: "controlclaw-backups.s3.eu-west-1.amazonaws.com"

# Caddy, installed from its GitHub release (tasks/caddy.yml). Checksums from
# caddy_<version>_checksums.txt on the release page.
caddy_version: "2.11.4"
caddy_deb_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
caddy_deb_sha512:
  amd64: "1c6f5404f3622e46d401d81f4af59677d46b886229c6694d60fd936b87c72d3bb5d1fcf42b55c8d555769fa75acf434ab618fc7e0df2c79cf8512ee580d38d06"
  arm64: "c43c62b7b583b31c682b3c3e1a31cf03759fbab01dcb0fc7d7fc3a5ce1bef43403583e26133920634a730a9fe31dae1386af4d3f9f3fc19fcc2c29ebf19de235"

# The hosts THIS ROLE downloads from when it re-runs on an agent box during an in-place update
# (cc-reprovision). The box is confined to the org proxy by then, so under a deny-by-default policy
# every download would be refused. The firewall allows these hosts for a box only while that box runs
# a confirmed update, and logs each request as update traffic (controlclaw
# apps/saas/docs/features/agent-updates.md, MITM_UPDATE_HOSTS in packages/mitm-proxy/addon.py).
#
# Exact host names only: the proxy drops wildcard entries. A first provision needs none of this, since
# the box is not confined until vm-agent-start.yml, the last step of the play.
#
# Adding a download to the role means adding its host here, and the new list reaches a firewall only
# when that firewall is updated. Keep it to hosts the role itself fetches from. Tailscale's own
# control and relay hosts are NOT here: those are allowed per box, after the owner joins it to a
# tailnet (TAILSCALE_HOSTS in the proxy).
agent_update_hosts:
  # cc-reprovision: the commit to install (api.github.com) and the clone itself (github.com)
  - github.com
  - api.github.com
  # gog.yml: a GitHub release download redirects to one of these
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  # apt: the Ubuntu mirror of the Hetzner image, and the upstream ones the role names
  - mirror.hetzner.com
  - archive.ubuntu.com
  - security.ubuntu.com
  # nodejs.yml, docker-linux.yml, browser-stream.yml (Chrome), caddy.yml, tailscale-linux.yml
  - deb.nodesource.com
  - download.docker.com
  - dl.google.com
  - dl.cloudsmith.io
  - pkgs.tailscale.com
  # rclone.yml
  - downloads.rclone.org
  # openclaw.yml, openclaw-search.yml, nodejs.yml (pnpm), vm-agent.yml (pnpm install)
  - registry.npmjs.org
  # AgentMail plugin registry and tarball
  - clawhub.ai
  # openclaw-meetings.yml: cc-wake, the Vosk library (PyPI wheel) and its model
  - files.pythonhosted.org
  - alphacephei.com

# App integrations: the OpenConnector runtime on the firewall (tasks/connector.yml). Version and
# digest must match apps/saas/app/(integrations)/lib/connector-catalog.ts in the control plane.
connector_image: "ghcr.io/oomol-lab/open-connector"
connector_image_digest: "sha256:f25207e6f71eabc70182c4f5db5c01db79091d0f4523a7495b35e649d5b6c006"
connector_port: 3910                 # loopback only: the runtime itself
connector_gate_port: 3900            # private IP: the mitm-agent's gate the agent boxes dial
connector_memory_max: 512m

# Inbound webhooks (controlclaw docs/plans/webhooks.md). Caddy on the firewall box terminates TLS
# for the org's firewall hostname and hands /hook/* to the mitm-agent's ingress on loopback.
# `ingress_max_body` is Caddy's outer bound only: the ingress caps each registration itself,
# because an HMAC is computed over the whole body and the check must see the same bytes.
ingress_port: 8790                   # loopback only: the mitm-agent's webhook ingress
ingress_max_body: 1MB                # the hard ceiling; a registration's own cap is <= this

# OpenClaw box egress wiring (set when the org has a mitm box)
mitm_box_private_ip: ""              # private IP of the org mitm box
mitm_ca_cert: ""                     # public CA cert (PEM) to install in the trust store

# Where cc-install-ca puts the org mitm CA. Node ignores the OS trust store, so every task that
# shells out to npm/pnpm points NODE_EXTRA_CA_CERTS at this file when it exists (see main.yml).
mitm_ca_path: /usr/local/share/ca-certificates/controlclaw-mitm.crt

# --- Encryption at rest -------------------------------------------------------------------------
#
# One LUKS2 container per box, opened over Clevis/Tang by the OTHER boxes in the same organization
# and by nothing else. Design: controlclaw `docs/plans/disk-encryption.md`.
#
# FALSE by default, and the control plane passes `true` only for secured boxes. That direction
# matters: an ansible-only change can never start encrypting boxes the control plane knows nothing
# about, which would strand them (it holds the recovery blob and drives the bindings).
#
# An unsecured development box is deliberately NOT encrypted. It has no firewall, so it has no
# partner, so every reboot would need a human — on the one kind of box whose whole point is speed.
disk_encryption: false

# The organization's recovery key, X25519 public half, base64. The same key the backups feature wraps
# data keys to. Passed per box by the control plane; without it the play refuses, because the sealed
# passphrase is the only way into a box whose partners are all down.
luks_recovery_pubkey: ""

luks_image_path: /var/lib/controlclaw/secure.img
luks_secure_mount: /opt/controlclaw/secure

# Sparse, so it occupies what is written rather than its nominal size — which is what keeps a box
# image small. 20 GiB on an agent (cx23 has a 40 GB disk, cx33 80 GB), less on a firewall, which
# holds stores and keys rather than an agent's workspace.
# A brain's is sized by the control plane from the box size (gbrain_container_gb, 60% of the disk),
# because its Postgres data and the dump a backup stages next to it both live inside.
luks_container_size_gb: "{{ 5 if box_role == 'mitm' else (gbrain_container_gb if box_role == 'gbrain' else 20) }}"

# Two ports, and only one of them is reachable. tangd itself is loopback-only; the gate in
# cc-secure-daemon faces the org's private network, checks the caller and logs every open.
luks_tang_gate_port: 3920
luks_tangd_port: 3921
# Where a locked box answers "here is this boot's key, seal the passphrase to it". Loopback; Caddy
# publishes it at /__cc/disk/* so the console can reach a box that has not opened its disk yet.
luks_locked_port: 3101

# The gate binds this box's address on the org's private network — never 0.0.0.0, never the public
# interface. There is deliberately NO variable for that address: the box works it out from the subnet
# below, because the control plane does not pass one to an agent and the obvious Ansible fact
# (`default_ipv4`) is the PUBLIC address on a Hetzner server. See cc-secure-daemon's `privateIp()`.

# What moves inside the container, as `subdir:target:owner:mode`. Everything that is the
# organization's, or that opens something of the organization's.
#
# Deliberately NOT here: /home/controlclaw/.ssh, because a consent-coded rescue grant puts its key
# there and the one moment support is wanted is a box that did not come up; and the OS and every
# binary, which are public, pinned and auditable, and whose staying plain is what means a locked box
# still boots and can be told to open itself.
# The proxy owns its private CA directory on every boot, matching mitmbox.yml.
# Resetting it to root:0700 here prevents the unprivileged proxy from starting after unlock.
luks_binds: >-
  {{
    ['keys:/opt/controlclaw/keys:' ~ controlclaw_user ~ ':0750',
     'state:/opt/controlclaw/state:' ~ controlclaw_user ~ ':0750']
    + (['openclaw:' ~ controlclaw_home ~ '/.openclaw:' ~ controlclaw_user ~ ':0750'] if box_role == 'openclaw' else [])
    + (['mitm-ca:/opt/controlclaw/mitm/ca:' ~ controlclaw_user ~ ':0700',
        'connector:/opt/controlclaw/connector:root:0700',
        'clickclack:/var/lib/clickclack:clickclack:0700'] if box_role == 'mitm' else [])
    + (['gbrain:' ~ gbrain_home ~ ':' ~ gbrain_user ~ ':0750',
        'postgresql:/var/lib/postgresql:postgres:0700'] if box_role == 'gbrain' else [])
    + (['notes:/var/lib/controlclaw-notes:root:0755'] if box_role == 'openclaw' else [])
  }}

# An agent's shared notes (tasks/shared-notes.yml) are inside the container when the box has one:
# the `notes` bind above, LAST in the list, so every other bind is in place before it is tried.
# cc-secure stops at a bind that fails, before it starts tang, and that script is not this change's
# to alter; the role makes the one thing that could fail it (the mount point not being a folder)
# impossible before the container is mounted (tasks/main.yml, before disk-encryption.yml).
# False in a CI run, which has no container even with disk_encryption on.
shared_notes_in_container: "{{ (disk_encryption | bool) and box_role == 'openclaw' and not (ci_test | default(false) | bool) }}"

# The units that read a path inside the container, and therefore wait for it. Caddy and ssh are
# deliberately absent: they are how a locked box is reached and fixed.
luks_dependent_units: >-
  {{
    (['controlclaw-agent.service', 'openclaw.service', 'browser-stream.service',
      'cc-drive@.service', 'cc-gmail-watch.service'] if box_role == 'openclaw' else [])
    + (['controlclaw-mitm-agent.service', 'controlclaw-mitmproxy.service',
        'controlclaw-connector.service', 'clickclack.service'] if box_role == 'mitm' else [])
    + (['controlclaw-agent.service', 'postgresql@' ~ gbrain_pg_version ~ '-' ~ gbrain_pg_cluster ~ '.service',
        'gbrain.service'] if box_role == 'gbrain' else [])
  }}

# GBrain box (box_role=gbrain): the organization's shared brain. One per org, next to the firewall.
# Design: controlclaw docs/plans/gbrain.md. GBrain is a single compiled binary (bun build --compile)
# published with every upstream release; it is pinned here by version AND sha256 and moves only when
# this file does, never by GBrain's own self-upgrade (which the role switches off).
gbrain_version: "0.60.10.0"
gbrain_sha256: "16c27c6660b50f61cff62a435e0bf26ea0091dc98d47160cccda00e4b3594650"
gbrain_download_url: "https://github.com/garrytan/gbrain/releases/download/v{{ gbrain_version }}/gbrain-linux-x64"
gbrain_bin_dir: /opt/controlclaw/gbrain
# A system account with no shell. Its home is GBrain's home (~/.gbrain holds config.json, the env
# file with the DB password and the admin token, and the markdown content root), and it is a bind
# inside the encrypted container.
gbrain_user: gbrain
gbrain_home: /var/lib/gbrain
# Loopback only. Nothing on the private network or the internet talks to GBrain directly: the gate
# that lets connected agents in and Caddy for the admin page both proxy to this.
gbrain_port: 3130
# The vm-agent's gate on the private address: connected agents' MCP traffic, each with its own token.
gbrain_gate_port: 3131
# Postgres from Ubuntu 24.04 (postgresql-16-pgvector is in universe). A cluster of its own rather
# than the package's default `main`, so its data directory is created inside the container.
gbrain_pg_version: "16"
gbrain_pg_cluster: gbrain
gbrain_pg_port: 5432
# Passed by the control plane per box size; this is the Small figure, for a box built without one.
gbrain_container_gb: 24

# Official ClawHub plugin, installed before the gateway starts. Its skill is kept in the controlclaw
