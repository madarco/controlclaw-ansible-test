---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart controlclaw-agent
  ansible.builtin.systemd:
    name: controlclaw-agent
    state: restarted
    daemon_reload: true

- name: restart controlclaw-mitmproxy
  ansible.builtin.systemd:
    name: controlclaw-mitmproxy
    state: restarted
    daemon_reload: true

- name: restart controlclaw-mitm-agent
  ansible.builtin.systemd:
    name: controlclaw-mitm-agent
    state: restarted
    daemon_reload: true

- name: update ca certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
