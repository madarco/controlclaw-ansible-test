---
# Install the OpenClaw gateway and run it under systemd.
#
# The unit is named `openclaw` on purpose: packages/vm-agent/src/routes/openclaw.ts hardcodes
# `const SERVICE = "openclaw"` and the console's start/stop buttons shell out to
# `sudo systemctl <action> openclaw`. The matching sudoers lines live in user.yml. Those three
# places must agree or the buttons return HTTP 500.
#
# The gateway binds loopback and is deliberately NOT opened in UFW. Caddy (caddy.yml) terminates
# TLS on 443 in front of it, behind the proxy box. `ssh -N -L 18789:127.0.0.1:18789 root@<box>`
# still works while SSH is open (ssh_debug).

- name: Assert node satisfies OpenClaw's engines range
  ansible.builtin.command: node --version
  register: openclaw_node_version
  changed_when: false

# npm picks the newest `openclaw` your node can run, so node 22 silently yields an old
# OpenClaw instead of failing. Fail loudly here rather than shipping a surprise version.
- name: Fail early when node is too old for OpenClaw
  ansible.builtin.assert:
    that:
      - openclaw_node_version.stdout | regex_replace('^v', '') is version('24.16.0', '>=')
    fail_msg: >-
      node {{ openclaw_node_version.stdout }} is too old for OpenClaw (needs >=24.16.0).
      Bump nodejs_version in roles/controlclaw/defaults/main.yml.

# Where the gateway keeps Node's compile cache, and why it has to be set up at all (T-102).
#
# OpenClaw turns the cache on itself, in-process, at `/tmp/node-compile-cache/openclaw/<version>/`.
# But npm 11 enables Node's compile cache too, at the same `/tmp/node-compile-cache`, and the play
# runs npm as root before the gateway ever starts — so the directory was created root-owned 0755,
# the gateway (running as controlclaw) could never create its `openclaw/` subdirectory, and OpenClaw
# swallows that error. Every gateway start on every box compiled all of its modules from scratch.
# The cache is worth ~0.8 s of a 12-15 s start, and ~0.4 s of every `openclaw` CLI call below.
#
# Pre-creating `openclaw/` for controlclaw is the whole fix, and it deliberately does NOT move the
# cache anywhere. Setting NODE_COMPILE_CACHE on the unit instead would be inherited by every process
# the agent starts, so the bytecode of a customer's own scripts would land wherever it points; the
# in-process cache OpenClaw already uses is not inherited, holds only OpenClaw's own modules, stays
# on /tmp and is wiped with it at every boot. 0700, and not world-writable: a cache another user
# could write to is code the gateway would load.
- name: Let the gateway write its compile cache (tmpfiles.d)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/controlclaw-openclaw-compile-cache.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by ControlClaw (roles/controlclaw/tasks/openclaw.yml). OpenClaw's own compile cache,
      # which it enables in-process under /tmp/node-compile-cache/openclaw. The parent is npm's too.
      d /tmp/node-compile-cache 0755 root root -
      d /tmp/node-compile-cache/openclaw 0700 {{ controlclaw_user }} {{ controlclaw_user }} -

# Every run, not only when the file changed: /tmp is emptied at boot and npm may already have made
# the parent root-owned by the time this runs. `d` fixes the owner and mode of a directory that is
# already there, so this is idempotent.
- name: Create the compile cache directories now
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/controlclaw-openclaw-compile-cache.conf
  changed_when: false

- name: Create OpenClaw config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ controlclaw_home }}/.openclaw", mode: '0755' }
    - { path: "{{ controlclaw_home }}/.openclaw/credentials", mode: '0700' }
    - { path: "{{ controlclaw_home }}/.openclaw/skills", mode: '0755' }

# Skills we ship with the box, one directory per skill with a SKILL.md in it. Their source is
# packages/skills in the controlclaw repo; scripts/deploy-skills.sh stages them here, each with a
# .controlclaw.json beside its SKILL.md that the agent's skills report reads.
#
# `~/.openclaw/skills` is OpenClaw's *managed* tier, and that is the point: the bundled tier lives
# inside the npm package, so anything written there is gone the next time this role runs
# `npm install -g openclaw@latest`. The managed tier survives the upgrade and outranks bundled on
# a name collision, so a skill here is still the one the agent loads after OpenClaw ships one of
# its own by the same name.
#
# The copy is not `delete: true`: a customer may have put their own skills in the same directory,
# and the box is theirs. Ours are replaced on every run, which is what makes an edit to a SKILL.md
# reach existing boxes through a re-provision.
#
# No restart: OpenClaw watches this folder, and a running agent reads a new or changed SKILL.md on
# its next turn (checked on a real box with 2026.9.9, 2026-10-12).
- name: Install the bundled OpenClaw skills
  ansible.builtin.copy:
    src: openclaw-skills/
    dest: "{{ controlclaw_home }}/.openclaw/skills/"
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: "0644"
    directory_mode: "0755"

# `npm install -g openclaw@latest` costs ~48s even when the package is already current, because it
# re-resolves and re-verifies 300+ packages. That made it the most expensive task on a box booted
# from the base image, which is precisely the one thing the image was supposed to make free.
# Compare versions first: one registry query (~1s) against the installed binary.
- name: Check the installed OpenClaw version
  ansible.builtin.command:
    cmd: openclaw --version
  register: openclaw_installed_version
  changed_when: false
  failed_when: false

# In a double-quoted scalar on purpose: YAML turns `\\.` into the `\.` the regex needs. The same
# expression in a `>-` block keeps both backslashes, matches nothing, and made every update stop the
# gateway and reinstall OpenClaw from a tarball the resolver had not downloaded (T-updfail).
- name: Read the installed OpenClaw version number
  ansible.builtin.set_fact:
    openclaw_installed_semver: "{{ openclaw_installed_version.stdout | default('') | regex_search('[0-9]{4}\\.[0-9]+\\.[0-9]+') | default('', true) }}"

# Second look for the firewall CA (main.yml looked once, at the top of the play). If the box has
# been confined since then, npm must get the CA or it hangs for hours (see vm-agent-start.yml).
- name: Look again for the org mitm CA before the npm steps
  ansible.builtin.stat:
    path: "{{ mitm_ca_path }}"
  register: mitm_ca_installed_now

- name: Refresh the node TLS environment for the npm steps
  ansible.builtin.set_fact:
    controlclaw_node_env: "{{ {'NODE_EXTRA_CA_CERTS': mitm_ca_path} if mitm_ca_installed_now.stat.exists else {} }}"

- name: Install the OpenClaw patch resolver
  ansible.builtin.copy:
    src: cc-openclaw-patch
    dest: /usr/local/bin/cc-openclaw-patch
    owner: root
    group: root
    mode: '0755'

- name: Resolve and verify the newest stable patch of the pinned OpenClaw month
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cc-openclaw-patch
      - "{{ openclaw_version }}"
      - "{{ openclaw_host_sha512 }}"
      - "{{ openclaw_installed_semver }}"
      - "{{ 'true' if openclaw_auto_patch | default(true) | bool else 'false' }}"
      - /opt/controlclaw/openclaw-pinned.tgz
  register: openclaw_patch
  changed_when: (openclaw_patch.stdout | from_json).changed

- name: Use the verified OpenClaw version
  ansible.builtin.set_fact:
    openclaw_resolved_version: "{{ (openclaw_patch.stdout | from_json).version }}"

# The installed host must match the tested plugin pin even on an older base image.
# The resolver's own answer decides: it downloads the tarball exactly when the version it chose is not
# the one installed, so installing on any other condition would run npm on a file that is not there.
- name: Decide whether the pinned OpenClaw needs installing
  ansible.builtin.set_fact:
    openclaw_install_wanted: "{{ (openclaw_patch.stdout | from_json).changed | bool }}"
    openclaw_upgrading: "{{ (openclaw_patch.stdout | from_json).changed | bool and openclaw_installed_semver | length > 0 }}"

# An upgrade can carry a state migration the new gateway will not run by itself (T-107). OpenClaw
# 2026.9.7 moved the agent database from schema 23 to 24, and on a v23 database it exits
# 78/CONFIG ("stop active agents and run openclaw doctor --fix to migrate session identities"),
# which systemd answers by starting it again two seconds later, for ever. And a running gateway
# does not wait for the end of the play: 2026.9.6 notices npm replacing its files and restarts
# itself onto the new build ("installation replaced"). So every agent updated in place from an
# older OpenClaw went into that loop halfway through its update, and stayed there: the console
# flipped between "OpenClaw running" and "OpenClaw stopped", and every read through the gateway
# answered "OpenClaw is not running on this box" (prod, 2026-09-30).
#
# So the gateway is stopped before the new build lands, the migration runs with nothing holding
# the databases, and the `restart openclaw` handler starts it once, at the end, as on a first boot.
- name: Stop the gateway before upgrading OpenClaw
  ansible.builtin.systemd:
    name: openclaw
    state: stopped
  when: openclaw_upgrading | bool
  # A base image carries the binary before it has a unit; nothing is running to stop.
  failed_when: false

- name: Install OpenClaw globally from npm
  ansible.builtin.command:
    cmd: npm install -g /opt/controlclaw/openclaw-pinned.tgz
  register: openclaw_npm_install
  environment: "{{ controlclaw_node_env }}"
  when: openclaw_install_wanted | bool
  changed_when: openclaw_npm_install.changed

# The same migration, for a box that is already in the loop: one updated before this task existed,
# where the new build is already installed and nothing above changes. The gateway's own message is
# the signal, read from this boot's journal. A match left over from a loop that is already fixed
# costs one more doctor run and a restart, and nothing else.
- name: Look for a state migration the gateway is waiting for
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      journalctl -u openclaw -b -n 400 --no-pager -o cat
      | grep -cE 'openclaw doctor --fix to migrate|Stop the Gateway, run "openclaw doctor --fix"'
    executable: /bin/bash
  register: openclaw_migration_pending
  changed_when: false
  failed_when: false

- name: Decide whether OpenClaw's state needs migrating
  ansible.builtin.set_fact:
    openclaw_migrate: >-
      {{ (openclaw_upgrading | bool and openclaw_npm_install is changed) or
         (openclaw_migration_pending.stdout | default('0') | int > 0) }}

- name: Stop the gateway for the state migration
  ansible.builtin.systemd:
    name: openclaw
    state: stopped
  when: openclaw_migrate | bool
  failed_when: false

# `--non-interactive` applies the safe migrations only. It also checks the installed plugins
# against the new build, which is npm traffic, hence the node environment: without the firewall's
# CA every lookup waits out npm's timeout and the run takes minutes instead of seconds.
- name: Migrate OpenClaw's state (openclaw doctor --fix)
  ansible.builtin.command:
    cmd: timeout 900 openclaw doctor --fix --non-interactive
    chdir: "{{ controlclaw_home }}"
  become: true
  become_user: "{{ controlclaw_user }}"
  environment: "{{ controlclaw_node_env | combine({'HOME': controlclaw_home}) }}"
  register: openclaw_doctor
  when: openclaw_migrate | bool
  changed_when: true
  # A failed repair must not stop the play before the handlers: the gateway would then stay
  # stopped, which is worse than what it had. The warning below says so, and the unit is started
  # either way.
  failed_when: false
  notify: restart openclaw

- name: Warn when the OpenClaw state migration failed
  ansible.builtin.debug:
    msg: >-
      openclaw doctor --fix exited {{ openclaw_doctor.rc }}; the gateway may refuse to start.
      {{ (openclaw_doctor.stderr | default('') ~ ' ' ~ openclaw_doctor.stdout | default('')) | trim | truncate(600) }}
  when: openclaw_migrate | bool and openclaw_doctor.rc | default(0) != 0

# The plan and the agent-https doc both assume /usr/bin/openclaw. NodeSource sets npm's prefix
# to /usr so that holds, but assert it rather than baking an unverified path into ExecStart.
- name: Locate the openclaw binary
  ansible.builtin.stat:
    path: /usr/bin/openclaw
  register: openclaw_bin

- name: Fail when the openclaw binary is not where the unit expects it
  ansible.builtin.assert:
    that:
      - openclaw_bin.stat.exists
    fail_msg: "openclaw was installed but is not at /usr/bin/openclaw - check npm's global prefix."

# Make the agent's browsing look like a person's browsing.
#
# OpenClaw attaches to the live Chrome with playwright-core (`chromium.connectOverCDP`), and
# Playwright leaves fingerprints on the wire that a bot check reads: it turns the CDP Runtime
# domain on for every page it touches and injects its own init scripts into the page's JS world.
# patchright-core is the same Playwright release with those removed. It ships the same files,
# the same entry points and the same `exports` map, so pointing OpenClaw's `playwright-core`
# directory at it changes no OpenClaw code — the loader in the browser plugin is a plain
# `require("playwright-core")` resolved at runtime from the global install.
#
# Measured on a real box rather than assumed: with playwright-core the attach sends
# `Runtime.enable` three times; with patchright-core, never. The trade-off is that patchright
# evaluates in an isolated world, so `openclaw browser evaluate` reads the DOM but not the
# page's own JS globals.
- name: Find the global node_modules directory
  ansible.builtin.command:
    cmd: npm root -g
  register: npm_global_root
  changed_when: false

- name: Read the playwright-core version OpenClaw depends on
  ansible.builtin.slurp:
    src: "{{ npm_global_root.stdout | trim }}/openclaw/package.json"
  register: openclaw_manifest

# patchright publishes one build per Playwright release and only matches that release's API —
# and it does not publish one for every release (1.58.0, 1.58.1 and 1.62.0 have no build). So
# the pair can legitimately drift: `openclaw@latest` is unpinned, and the day OpenClaw moves
# Playwright this box would otherwise be asked to alias two versions that are not the same API.
#
# This DEGRADES rather than failing the play. A hard stop here would take the whole box down —
# no gateway unit, no Caddy, no vm-agent ready — over a fingerprinting nicety, and there would
# not always be a one-line fix available. Instead the alias is skipped, the box keeps working
# with stock Playwright, and the play says so loudly. Bump patchright_version in
# roles/controlclaw/defaults/main.yml once patchright publishes the matching build.
#
# The declared spec is read defensively: an absent key (moved to optionalDependencies, bundled)
# or a range (`^1.63.0`) both mean "do not alias" rather than a Jinja error mid-play.
- name: Decide whether patchright matches OpenClaw's playwright-core
  ansible.builtin.set_fact:
    openclaw_playwright_version: "{{ openclaw_declared_playwright }}"
    patchright_applies: "{{ openclaw_declared_playwright == patchright_version }}"
  vars:
    openclaw_declared_playwright: >-
      {{ ((openclaw_manifest.content | b64decode | from_json).dependencies | default({}))['playwright-core'] | default('') | trim }}

- name: Warn when the agent's browser will run unpatched Playwright
  ansible.builtin.debug:
    msg: >-
      OpenClaw {{ (openclaw_manifest.content | b64decode | from_json).version | default('?') }}
      declares playwright-core "{{ openclaw_playwright_version | default('(none)') }}", but
      patchright_version is pinned to {{ patchright_version }}. NOT aliasing: this box's browser
      will announce itself over CDP on every page it opens, and sites that fingerprint will see
      it. Set patchright_version to the declared version in
      roles/controlclaw/defaults/main.yml once patchright-core publishes that build.
  when: not patchright_applies | bool

- name: Create the patchright install prefix
  ansible.builtin.file:
    path: "{{ patchright_prefix }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: patchright_applies | bool

# A manifest rather than `npm install patchright-core@<version>`: the pin then lives in one
# place on the box too, and `npm install` in this directory is a no-op once it matches.
- name: Write the patchright manifest
  ansible.builtin.copy:
    dest: "{{ patchright_prefix }}/package.json"
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "name": "controlclaw-patchright",
        "private": true,
        "dependencies": { "patchright-core": "{{ patchright_version }}" }
      }
  when: patchright_applies | bool

- name: Read the installed patchright-core version
  ansible.builtin.command:
    cmd: node -p "require('{{ patchright_prefix }}/node_modules/patchright-core/package.json').version"
  register: patchright_installed
  changed_when: false
  failed_when: false
  when: patchright_applies | bool

- name: Install patchright-core
  ansible.builtin.command:
    cmd: npm install --no-audit --no-fund --omit=dev
    chdir: "{{ patchright_prefix }}"
  environment: "{{ controlclaw_node_env }}"
  when: patchright_applies | bool and patchright_installed.stdout | default('') | trim != patchright_version
  changed_when: true

- name: Look at OpenClaw's playwright-core directory
  ansible.builtin.stat:
    path: "{{ npm_global_root.stdout | trim }}/openclaw/node_modules/playwright-core"
  register: openclaw_playwright_dir
  when: patchright_applies | bool

# `file: state=link` refuses to replace a real directory, and a re-installed OpenClaw brings
# the stock one back, so clear it first. Only when it is a directory: on every later run it is
# already our symlink and this is a no-op.
- name: Remove the stock playwright-core before aliasing it
  ansible.builtin.file:
    path: "{{ npm_global_root.stdout | trim }}/openclaw/node_modules/playwright-core"
    state: absent
  when:
    - patchright_applies | bool
    - openclaw_playwright_dir.stat.exists | default(false)
    - not openclaw_playwright_dir.stat.islnk | default(false)

- name: Point OpenClaw's playwright-core at patchright-core
  ansible.builtin.file:
    src: "{{ patchright_prefix }}/node_modules/patchright-core"
    dest: "{{ npm_global_root.stdout | trim }}/openclaw/node_modules/playwright-core"
    state: link
    owner: root
    group: root
  when: patchright_applies | bool
  notify: restart openclaw

# Proof, from OpenClaw's own module resolver rather than from the file listing: the alias is
# only worth anything if `require("playwright-core")` inside the browser plugin lands on it.
# Run as the user the gateway runs as, not as root — a package root can be perfectly correct and
# still be unreadable to the only process that has to read it, which is how a bad prefix took
# the browser tool out on a real box while every root-side check passed.
- name: Check what OpenClaw resolves playwright-core to
  ansible.builtin.command:
    cmd: >-
      node -p "require('module').createRequire('{{ npm_global_root.stdout | trim }}/openclaw/dist/probe.mjs')('playwright-core/package.json').name"
  become: true
  become_user: "{{ controlclaw_user }}"
  register: playwright_resolves_to
  changed_when: false
  failed_when: false
  when: patchright_applies | bool

- name: Fail when OpenClaw would still drive the browser with stock Playwright
  ansible.builtin.assert:
    that:
      - playwright_resolves_to.stdout | default('') | trim == 'patchright-core'
    fail_msg: >-
      As {{ controlclaw_user }}, OpenClaw resolves playwright-core to
      "{{ playwright_resolves_to.stdout | default('') | trim }}"
      ({{ playwright_resolves_to.stderr | default('') | trim | truncate(200) }}), not
      patchright-core. Either the alias did not land — the agent's Chrome would announce itself
      on the CDP wire on every page it opens — or the gateway user cannot read
      {{ patchright_prefix }}, which takes the browser tool out altogether.
  when: patchright_applies | bool

- name: Check for an existing gateway token
  ansible.builtin.stat:
    path: /opt/controlclaw/keys/openclaw_gateway_token
  register: openclaw_token_file

# Generated once and never rotated: ansible-pull re-runs on every boot, and rotating the token
# would silently break whatever link the customer saved.
- name: Generate the gateway token on first provision
  ansible.builtin.shell:
    cmd: openssl rand -hex 32 > /opt/controlclaw/keys/openclaw_gateway_token
  when: not openclaw_token_file.stat.exists
  no_log: true

- name: Secure the gateway token file
  ansible.builtin.file:
    path: /opt/controlclaw/keys/openclaw_gateway_token
    owner: "{{ controlclaw_user }}"
    group: "{{ controlclaw_user }}"
    mode: '0600'

- name: Read the gateway token
  ansible.builtin.slurp:
    src: /opt/controlclaw/keys/openclaw_gateway_token
  register: openclaw_token_b64
  no_log: true

# OpenClaw's Systems tab shows a desktop for the gateway host when desktop.host.enabled is true,
# and observing it means attaching to a loopback VNC server that asks for a password.
# browser-stream.yml runs that server (a second x11vnc over the same display :1, on
# browser_desktop_vnc_port), writes the password both programs need, and leaves
# browser_desktop_ready saying whether the thing actually answers with VncAuth.
#
# All three have to hold, and the last one is why this is a fact rather than a flag. OpenClaw
# advertises the host desktop on `enabled` alone, without probing anything -- so writing
# enabled:true with no server behind it does not give the customer a desktop, it gives them a
# Systems tab that offers one and then fails when they click it. "No desktop available" is the
# better of those two.
#
# Written as enabled:false rather than left out, so a box that had a desktop and is
# re-provisioned without one actually loses it instead of keeping a stale true.
- name: Look for the desktop VNC password the gateway will read
  ansible.builtin.stat:
    path: "{{ openclaw_desktop_password_file }}"
  register: openclaw_desktop_password

- name: Decide whether this box advertises a desktop
  ansible.builtin.set_fact:
    openclaw_desktop_expected: >-
      {{ (browser_stream_enabled | bool) and (openclaw_desktop_enabled | bool)
         and openclaw_desktop_password.stat.exists
         and (browser_desktop_ready | default(false) | bool) }}

# Read the config file directly rather than shelling out to `openclaw config get`: each CLI call
# pays Node's startup cost (~4s), and four of them made this the 5th most expensive task in the
# whole provision. The file also carries the real token, whereas `config get` redacts it - so this
# is both faster and a more accurate check.
- name: Read the current OpenClaw config
  ansible.builtin.slurp:
    src: "{{ controlclaw_home }}/.openclaw/openclaw.json"
  register: openclaw_config_raw
  failed_when: false
  no_log: true

# Compare only the fields we own, not the whole gateway block: OpenClaw writes to this file
# itself (it added a top-level `plugins` key on its own), and the agent-https plan will add
# `gateway.publicOrigin`. A strict equality check would then re-patch and restart the gateway on
# every boot. The browser block below is ours too, so it has to be checked here as well —
# otherwise every run sees a "mismatch", re-patches, and restarts the gateway under the customer.
- name: Decide whether the gateway config needs writing
  ansible.builtin.set_fact:
    openclaw_config_ok: >-
      {{ openclaw_config_raw.content is defined and
         openclaw_gateway_current.mode | default('') == 'local' and
         openclaw_gateway_current.bind | default('') == 'loopback' and
         openclaw_gateway_current.port | default(0) == openclaw_gateway_port | int and
         openclaw_gateway_current.auth.mode | default('') == 'token' and
         openclaw_gateway_current.auth.token | default('') == (openclaw_token_b64.content | b64decode | trim) and
         openclaw_browser_current.enabled | default(false) | bool and
         openclaw_browser_current.attachOnly | default(false) | bool and
         openclaw_browser_current.defaultProfile | default('') == 'openclaw' and
         openclaw_browser_profile.cdpUrl | default('') == openclaw_cdp_url and
         openclaw_browser_profile.attachOnly | default(false) | bool and
         (openclaw_desktop_current.enabled | default(false) | bool) == (openclaw_desktop_expected | bool) and
         (not openclaw_desktop_expected | bool or (
           openclaw_desktop_current.port | default(0) == browser_desktop_vnc_port | int and
           openclaw_desktop_current.passwordFile | default('') == openclaw_desktop_password_file)) and
         (vm_hostname is not defined or (
           openclaw_gateway_current.publicOrigin | default('') == 'https://' ~ vm_hostname and
           openclaw_gateway_current.trustedProxies | default([]) == ['127.0.0.1'] and
           openclaw_gateway_current.controlUi.allowedOrigins | default([]) == ['https://' ~ vm_hostname] and
           openclaw_mcp_apps_current.sandboxOrigin | default('') == 'https://sandbox.' ~ vm_hostname)) }}
  vars:
    openclaw_gateway_current: >-
      {{ (openclaw_config_raw.content | default('') | b64decode | from_json).gateway
         if openclaw_config_raw.content is defined else {} }}
    openclaw_browser_current: >-
      {{ (openclaw_config_raw.content | default('') | b64decode | from_json).browser | default({})
         if openclaw_config_raw.content is defined else {} }}
    openclaw_mcp_apps_current: >-
      {{ ((openclaw_config_raw.content | default('') | b64decode | from_json).mcp | default({})).apps | default({})
         if openclaw_config_raw.content is defined else {} }}
    # Resolved a level at a time. A config with `browser.enabled` and no `profiles` is a real
    # shape (OpenClaw writes its own defaults), and whether a chained `.profiles.openclaw.x`
    # yields undefined or raises depends on the Jinja undefined class the installed ansible-core
    # happens to use. This does not.
    openclaw_browser_profile: >-
      {{ (openclaw_browser_current.profiles | default({})).openclaw | default({}) }}
    openclaw_desktop_current: >-
      {{ ((openclaw_config_raw.content | default('') | b64decode | from_json).desktop | default({})).host | default({})
         if openclaw_config_raw.content is defined else {} }}
  no_log: true

# `config patch` is a single validated write against OpenClaw's own schema - better than
# templating openclaw.json ourselves, which would rot the moment the schema changes.
# gateway.mode=local is required, otherwise `gateway run` refuses to start without
# --allow-unconfigured. The JSON is built as text so `port` stays a number: piping a dict
# through `to_json` would emit "18789" as a string and fail schema validation.
# With a hostname, OpenClaw also learns its public origin (Caddy in front on 443), trusts the
# loopback proxy for forwarded headers, and allows the browser origin for its WebSocket.
#
# `controlUi.allowedOrigins` is THIS BOX'S OWN ORIGIN AND NOTHING ELSE, and it has to stay that way
# (controlclaw T-68). Every agent box and the console are one site under `controlclaw.com`, so a
# page on another box can reach this gateway's WebSocket with this box's session cookie attached;
# OpenClaw's own origin check is the last of the three that stand in the way, after the Caddy
# `forward_auth` to /__cc/verify and the vm-agent's check behind it. Adding the console, a wildcard
# or a second box here takes one of the three away. The console never talks to the gateway: it
# links to the box and the browser goes there.
#
# The browser block attaches OpenClaw to the Chrome that browser-stream.service already runs, so
# the window the customer is watching in the console is the one the agent drives. Notes, all
# verified against OpenClaw 2026.9.5 rather than assumed:
#   * cdpUrl is set on the PROFILE, not only at the top level. Top-level browser.cdpUrl reaches
#     the default profile through a `||=` fallback that any persisted `profiles.openclaw` beats
#     silently, and for http(s) URLs only the port is inherited.
#   * attachOnly in both places. It is the only thing stopping OpenClaw from launching its own
#     invisible Chrome the moment CDP is briefly unreachable — which looks like the agent
#     ignoring the live browser.
#   * no `color`: required in 2026.3.13, removed in 2026.9.5, and both objects are strictObject.
#     The box installs @latest, so sending it would fail validation on new boxes.
#   * no `headless` / `executablePath`: OpenClaw never launches anything here.
#   * the profile name must match ^[a-z0-9-]+$.
#
# The desktop block is what puts this box on OpenClaw's Systems tab. `enabled` is the whole
# switch -- `environments.list` reports `desktop: true` for the gateway host on that key alone,
# without probing anything, which is why browser-stream.yml opens the RFB handshake itself and
# leaves the answer in browser_desktop_ready. `managed` is deliberately absent: managed means OpenClaw starts its own
# TigerVNC + XFCE on a fresh display, which would be a second, empty desktop with none of the
# customer's browser on it. `port` and `passwordFile` point it at the mirror of display :1 that
# browser-stream.sh already runs. Changing desktop.host needs a gateway restart, which the
# handler below does.
#
# Both JSON fragments below start with a COMMA, and that is load-bearing. Ansible runs its own
# literal_eval over a templated result, so a value that merely looks like a dict comes back as a
# real dict and renders as Python — `{'enabled': True, …}` — which is not JSON and which
# `config patch` rejects. A fragment starting with `,` can never be read that way. Found on a
# real box (vnc-live-3, 2026-09-20), where the task failed under `no_log` and said nothing.
- name: Configure the gateway (loopback, token auth, public origin), the live browser and the desktop
  ansible.builtin.shell:
    cmd: >-
      printf '%s'
      '{"gateway":{"mode":"local","bind":"loopback","port":{{ openclaw_gateway_port | int }},"auth":{"mode":"token","token":"{{ openclaw_token_b64.content | b64decode | trim }}"}{{ openclaw_origin_json }}}{{ openclaw_browser_json }}{{ openclaw_desktop_json }}{{ openclaw_sandbox_json }}}'
      | /usr/bin/openclaw config patch --stdin
  vars:
    openclaw_origin_json: >-
      {{ ',"publicOrigin":"https://' ~ vm_hostname ~ '","trustedProxies":["127.0.0.1"],"controlUi":{"allowedOrigins":["https://' ~ vm_hostname ~ '"]}'
         if vm_hostname is defined else '' }}
    openclaw_browser_json: >-
      {{ ',"browser":{"enabled":true,"attachOnly":true,"defaultProfile":"openclaw","profiles":{"openclaw":{"cdpUrl":"' ~ openclaw_cdp_url ~ '","attachOnly":true}}}' }}
    # The widget sandbox's own origin (HTML widgets, MCP Apps). Without it the dashboard frames
    # https://<host>:18790, which nothing routes ("Widget sandbox host is unavailable"); OpenClaw
    # refuses one equal to the dashboard's. Caddy serves this name (Caddyfile.j2), signed in like the
    # dashboard. `mcp` is merged, so the vm-agent's mcp.servers stay as they are.
    openclaw_sandbox_json: >-
      {{ (',"mcp":{"apps":{"sandboxOrigin":"https://sandbox.' ~ vm_hostname ~ '"}}') if vm_hostname is defined else '' }}
    openclaw_desktop_json: >-
      {{ (',"desktop":{"host":{"enabled":true,"port":' ~ browser_desktop_vnc_port | int ~ ',"passwordFile":"' ~ openclaw_desktop_password_file ~ '"}}')
         if openclaw_desktop_expected | bool else ',"desktop":{"host":{"enabled":false}}' }}
  become: true
  become_user: "{{ controlclaw_user }}"
  environment:
    HOME: "{{ controlclaw_home }}"
  when: not openclaw_config_ok | bool
  no_log: true
  notify: restart openclaw

# The patch runs under no_log, so when it fails the play says only "censored" — which is how the
# comma bug above survived a whole box build. Read the result back and fail with something an
# operator can act on. The slurp is no_log (the file holds the gateway token); the assert prints
# only its own expression text and fail_msg, never the content.
- name: Re-read the OpenClaw config after patching
  ansible.builtin.slurp:
    src: "{{ controlclaw_home }}/.openclaw/openclaw.json"
  register: openclaw_config_after
  when: not openclaw_config_ok | bool
  no_log: true

- name: Fail clearly when the gateway or browser block did not land
  ansible.builtin.assert:
    that:
      - (openclaw_config_written.gateway | default({})).port | default(0) == openclaw_gateway_port | int
      - ((openclaw_config_written.browser | default({})).profiles | default({})).openclaw | default({})
        is mapping
      - (((openclaw_config_written.browser | default({})).profiles | default({})).openclaw | default({})).cdpUrl
        | default('') == openclaw_cdp_url
      - ((openclaw_config_written.desktop | default({})).host | default({})).enabled | default(false) | bool
        == openclaw_desktop_expected | bool
      - not openclaw_desktop_expected | bool or
        ((openclaw_config_written.desktop | default({})).host | default({})).port | default(0)
        == browser_desktop_vnc_port | int
      - not openclaw_desktop_expected | bool or
        ((openclaw_config_written.desktop | default({})).host | default({})).passwordFile | default('')
        == openclaw_desktop_password_file
    fail_msg: >-
      `openclaw config patch` ran but {{ controlclaw_home }}/.openclaw/openclaw.json does not hold
      what we asked for. The patch task is no_log (its command carries the gateway token), so read
      that file on the box rather than the play output.
  vars:
    openclaw_config_written: >-
      {{ openclaw_config_after.content | default('') | b64decode | from_json
         if openclaw_config_after.content is defined else {} }}
  when: not openclaw_config_ok | bool

# web_search: install the search plugins and name a provider. Before the unit is created, so a
# first provision starts the gateway with both already in place rather than restarting it.
- name: Include the web-search provider setup
  ansible.builtin.include_tasks: openclaw-search.yml

- name: Include AgentMail email plugin
  ansible.builtin.include_tasks: openclaw-agentmail.yml

- name: Install meeting config helper
  ansible.builtin.copy:
    src: meeting-config.py
    dest: /opt/controlclaw/meeting-config.py
    mode: '0755'

- name: Include Google Meet and the shared audio session
  ansible.builtin.include_tasks: openclaw-meetings.yml

# Node does not read the OS trust store, so on a secured box every outbound TLS call from
# OpenClaw would fail against the mitm proxy. NODE_EXTRA_CA_CERTS is not set here: the CA only
# exists after the vm-agent verifies and installs it at runtime, and `cc-install-ca`
# (openclaw-egress.yml) then writes a systemd drop-in with the variable and restarts OpenClaw.
# PrivateTmp is left off deliberately: OpenClaw writes its logs to /tmp/openclaw/, and a
# private namespace would hide them from an operator on the box (and from `openclaw
# diagnostics`). Revisit if the log path becomes configurable.
- name: Create the openclaw systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/openclaw.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=OpenClaw AI Gateway
      After=network-online.target docker.service browser-stream.service cc-drive.target
      Wants=network-online.target browser-stream.service cc-drive.target
      # cc-drive.target is the Google Drive folders (tasks/rclone.yml). Wants, never Requires: the
      # mounts are Type=notify so After= genuinely waits for the folders to be there before the
      # agent looks, but a Drive outage must not be able to keep the agent down.

      # DISPLAY is deliberately NOT set on this unit. Attaching over CDP never spawns a process,
      # and an X display in the environment only risks re-enabling OpenClaw's local-open path.
      # The desktop source does not want it either: it reaches display :1 over a TCP RFB socket
      # on loopback, not through X.

      [Service]
      Type=simple
      User={{ controlclaw_user }}
      Group={{ controlclaw_user }}
      WorkingDirectory={{ controlclaw_home }}
      Environment=HOME={{ controlclaw_home }}
      ExecStart=/usr/bin/openclaw gateway run
      # 2 s, not 10 (T-102). A config change OpenClaw cannot hot-apply (memory.search, which the
      # first model push always writes) makes it exit and hand the restart to systemd, and every
      # second here is a second the agent is down. A crash loop is still paced by the start itself,
      # which takes over 6 s before it can fail.
      Restart=always
      RestartSec=2
      # systemd's default is 90 s. An OpenClaw that has stopped answering ignores the stop signal,
      # so Restart from the console waited those 90 s while the vm-agent gives the whole action 30
      # (SERVICE_ACTION_MS) and reported a failure. After 25 s it is killed. OpenClaw reads this
      # value and sizes its own shutdown from it: 10 s to let work in flight end, then exit.
      TimeoutStopSec=25
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=openclaw
      NoNewPrivileges=true
      PrivateTmp=false

      [Install]
      WantedBy=multi-user.target
  notify: restart openclaw

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start the openclaw service
  ansible.builtin.systemd:
    name: openclaw
    state: started
    enabled: true
  when: not ci_test
