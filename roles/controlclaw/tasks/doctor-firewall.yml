---
- name: Doctor | create an unprivileged firewall account
  ansible.builtin.user:
    name: ccdoctor
    system: true
    home: /var/lib/ccdoctor
    shell: /usr/sbin/nologin
    create_home: true
    password_lock: true

- name: Doctor | session tools
  ansible.builtin.apt:
    name: [tmux, openssh-client, python3, util-linux]
    state: present
  when: not ci_test

- name: Doctor | tmpfs session root
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/ccdoctor.conf
    content: "d /run/ccdoctor 0711 root root -\n"
    owner: root
    group: root
    mode: '0644'

# A Final check's two unix sockets (controlclaw docs/plans/template-ai-sessions.md): the mitm-agent
# makes a folder per session here, and the session's unit gets only that folder, read-only.
- name: Doctor | folder for a Final check's sockets
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/ccdoctor-sock.conf
    content: "d /run/ccdoctor-sock 2750 {{ controlclaw_user }} ccdoctor -\n"
    owner: root
    group: root
    mode: '0644'

- name: Doctor | create the sockets folder now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/ccdoctor-sock.conf
  changed_when: false
  when: not ci_test

- name: Doctor | install root brokers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: [cc-doctor-run, cc-doctor-stop, cc-doctor-attach]

- name: Doctor | install unit helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/lib/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: [cc-doctor-worker, cc-doctor-cleanup]

- name: Doctor | narrow sudo policies
  ansible.builtin.copy:
    dest: /etc/sudoers.d/controlclaw-doctor
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |
      {{ controlclaw_user }} ALL=(root) NOPASSWD: /usr/local/bin/cc-doctor-run *, /usr/local/bin/cc-doctor-stop *
      {{ controlclaw_user }} ALL=(ccdoctor) NOPASSWD: /usr/local/bin/cc-doctor-attach *

# Firewall Doctor (controlclaw docs/plans/doctor-rescue.md, Phase 2). The coding agent calls
# cc-fwdoctor, which only talks to the mitm-agent on loopback; the mitm-agent runs cc-fw-repair.
# ccdoctor gets no sudo: the root helper is the controlclaw account's, and only for fixed verbs.
- name: Doctor | firewall repair helper and its client
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.src }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: cc-fw-repair, mode: '0755' }
    - { src: cc-fwdoctor, mode: '0755' }

# A Final check of an agent after a template was applied (controlclaw
# docs/plans/template-ai-sessions.md). The coding agent calls cc-tplcheck, which only talks to the
# mitm-agent on loopback; the mitm-agent passes a fixed list of read-only commands to the agent.
- name: Doctor | the Final check's client
  ansible.builtin.copy:
    src: cc-tplcheck
    dest: /usr/local/bin/cc-tplcheck
    owner: root
    group: root
    mode: '0755'

- name: Doctor | one sudoers line for the firewall repair helper
  ansible.builtin.copy:
    dest: /etc/sudoers.d/controlclaw-fw-repair
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Firewall Doctor's fixed repair actions (files/cc-fw-repair), run by the mitm-agent for a confirmed session.
      {{ controlclaw_user }} ALL=(root) NOPASSWD: /usr/local/bin/cc-fw-repair *

- name: Doctor | download integrity-pinned CLI packages
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/var/cache/cc-doctor-{{ item.cli }}-{{ item.version }}.tgz"
    checksum: "sha512:{{ item.sha512 }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ doctor_cli_pins }}"
  when: not ci_test

- name: Doctor | install pinned CLI packages
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --global
      - --prefix
      - /usr/local
      - --no-audit
      - --no-fund
      - "/var/cache/cc-doctor-{{ item.cli }}-{{ item.version }}.tgz"
    creates: "/var/cache/cc-doctor-{{ item.cli }}-{{ item.version }}.installed"
  loop: "{{ doctor_cli_pins }}"
  environment: "{{ controlclaw_node_env | combine({'DISABLE_AUTOUPDATER': '1', 'CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC': '1'}) }}"
  when: not ci_test

- name: Doctor | remember installed CLI versions
  ansible.builtin.copy:
    dest: "/var/cache/cc-doctor-{{ item.cli }}-{{ item.version }}.installed"
    content: "{{ item.sha512 }}\n"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ doctor_cli_pins }}"
  when: not ci_test
