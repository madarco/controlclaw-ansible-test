---
# box_role selects what this box is:
#   openclaw (default) - agent box: docker, node, vm-agent, OpenClaw gateway, Caddy in front
#   proxy              - the blind L4 proxy in front of every agent box (HAProxy)
#   mitm               - per-org egress proxy / secret zone
#   exit-relay         - the shared residential exit relay in front of Apify
#   gbrain             - the organization's shared GBrain (Postgres + pgvector), next to the firewall
# system tools, the service user and the firewall apply to every role.

# Node does not read the OS trust store. Once the box is confined to the org mitm proxy, every
# npm/pnpm call fails the TLS handshake and then HANGS with no error (25 minutes on one task, real
# box 2026-09-18) unless NODE_EXTRA_CA_CERTS points at the proxy CA. The CA is installed at runtime
# by the vm-agent, which main.yml starts as the LAST step of the play (vm-agent-start.yml), so it is
# absent for the whole first provision (egress is direct until then) and present on every re-run.
# Look for it here and hand the variable to the npm/pnpm tasks; openclaw.yml looks again right
# before its own npm steps, in case anything ever confines the box earlier.
- name: Look for the org mitm CA in the trust store
  ansible.builtin.stat:
    path: "{{ mitm_ca_path }}"
  register: mitm_ca_installed

- name: Build the node TLS environment for npm/pnpm tasks
  ansible.builtin.set_fact:
    controlclaw_node_env: "{{ {'NODE_EXTRA_CA_CERTS': mitm_ca_path} if mitm_ca_installed.stat.exists else {} }}"

# The born stamp: when this box was given to its organization, as one ISO time in a root-owned
# file. The vm-agent reads it (controlclaw packages/vm-agent/src/born.ts) to tell a new agent from
# one that has been running: the template an agent is created with is applied without a
# confirmation code only while it is new, and skills start the same way.
#
# Written ONCE, and only in two places:
#   - here, on the FIRST PROVISIONING of a box created for its organization;
#   - by cc-pool-local.cjs `activate`, when a box from the ready pool is claimed. A pool box is
#     built and paired long before that, so it gets no stamp when it is warmed (pool_unclaimed).
#
# "First provisioning" is asked of the box itself, before this play has written anything:
#   - /etc/controlclaw/release.json is absent. release.yml writes it as the last step of every play
#     that succeeds, and the base image build scrubs it, so its absence is "this box has never
#     finished a provision": the same test fast-path.yml makes. An Update (cc-reprovision re-runs
#     this role) finds it and writes no stamp.
#   - /opt/controlclaw/keys/vm_id is absent. The keys are written by this play into the box's own
#     encrypted container and scrubbed from the image, so a box that has them was provisioned
#     before, whatever its release record says: an agent from before release.json existed, on its
#     first Update, has its keys and gets no stamp. Such an agent never has one, and the vm-agent
#     reads a missing stamp as "not new".
#   NOT the update pin: /etc/controlclaw/update.conf is written during the image build and stays
#   in the image, so every box built from an image has it from its first boot.
#
# NEVER IN AN IMAGE BUILD (vm_id is "image-build": controlclaw apps/saas/app/(vm)/lib/base-image.ts).
# A stamp baked into the image would be every agent's stamp: the build's time, kept by force: no,
# so no agent would ever be new. The build also removes the file and refuses to snapshot a disk
# that has one.
#
# It is early in the play on purpose: a first provisioning that fails later and is run again must
# not find its own keys and conclude it was provisioned before. force: no keeps a stamp that is
# there. The file is in no backup or restore (controlclaw packages/backup-envelope lists what is,
# by path). The agent's own user can write neither the file nor its folder, and the vm-agent takes
# no stamp that is not root's in a folder that is root's.
- name: Born stamp | has this box finished a provision before
  ansible.builtin.stat:
    path: /etc/controlclaw/release.json
  register: cc_born_release

- name: Born stamp | does this box have its identity already
  ansible.builtin.stat:
    path: /opt/controlclaw/keys/vm_id
  register: cc_born_identity

- name: Born stamp | is this the first provisioning of a box for its organization
  ansible.builtin.set_fact:
    cc_born_now: >-
      {{ box_role in ['openclaw', 'mitm', 'gbrain']
         and (vm_id | default('')) != 'image-build'
         and not (pool_unclaimed | default(false) | bool)
         and not (cc_born_release.stat.exists | default(false))
         and not (cc_born_identity.stat.exists | default(false)) }}

# /etc/controlclaw is root's and nobody else can write in it (every task that makes it says root,
# 0755): the agent's own user can neither change the stamp nor move it aside or put another in its
# place. That is why it is here, next to release.json and update.conf, and not under
# /opt/controlclaw, which belongs to that user.
- name: Born stamp | make sure its folder exists and is root's
  ansible.builtin.file:
    path: /etc/controlclaw
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: cc_born_now | bool

- name: Born stamp | record when this box was born (first provisioning only)
  ansible.builtin.copy:
    dest: /etc/controlclaw/born
    content: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}\n"
    owner: root
    group: root
    mode: '0644'
    force: no
  when: cc_born_now | bool

# First, and on every role: the firewall's dev-consent gate reads the file this writes, and a box
# that failed halfway through provisioning should still be able to say what it was built from.
- name: Record where this box's Ansible came from
  ansible.builtin.include_tasks: provenance.yml

# Before the first install, and on every role: decide whether this boot may skip the tasks whose
# only job is installing what the base image already has. It reads three things (the image's
# commit, whether this box has ever finished a provision, and what is actually on disk) and says
# so in the log. It changes nothing by itself; it only sets `cc_fast_path` and `cc_skip`, which
# default to "run everything".
- name: Decide whether this is a first boot from a matching base image
  ansible.builtin.include_tasks: fast-path.yml

- name: Include system tools installation tasks
  ansible.builtin.include_tasks: system-tools.yml

- name: Include user creation tasks
  ansible.builtin.include_tasks: user.yml

# Every agent box, whatever tailscale_enabled says: the console's owner access over Tailscale needs
# the package, the cc-tailscale helper and its sudoers line on the box before anyone asks to join.
# tailscale_enabled only decides whether tailscaled runs from provisioning (see the file's header).
# Firewall, proxy and relay boxes never join a tailnet, unless tailscale_enabled asks for it.
- name: Include Tailscale installation tasks
  ansible.builtin.include_tasks: tailscale-linux.yml
  when: box_role == 'openclaw' or tailscale_enabled | bool

- name: Include Docker installation tasks
  ansible.builtin.include_tasks: docker-linux.yml
  when: not ci_test and controlclaw_uses_docker | bool

- name: Include firewall configuration tasks
  ansible.builtin.include_tasks: firewall-linux.yml
  when: not ci_test

# Right after the firewall, and on every role: the two halves of "no operator access over 22" belong
# next to each other, and this runs after user.yml so the controlclaw account whose keys it
# deliberately spares already exists.
- name: Include SSH lockdown tasks (no operator key, no root login, no passwords)
  ansible.builtin.include_tasks: ssh-lockdown.yml
  when: not ci_test

# Right after the firewall, and on EVERY role: the cloud metadata service hands out this box's own
# user-data, and only root has a reason to read it (T-61). Every role, because the two whose user-data
# holds a credential that would have to be rotated by hand are `proxy` (the read-only Hetzner token)
# and `exit-relay` (the Apify password, the token secret, the metering secret) — the two it would be
# most tempting to leave out. See the header of metadata-guard.yml for what it is worth on each, and
# for why this is a guard rather than an exemption in the redirect.
- name: Refuse the cloud metadata service to everything but root
  ansible.builtin.include_tasks: metadata-guard.yml

- name: Include Node.js installation tasks
  ansible.builtin.include_tasks: nodejs.yml
  when: box_role != 'proxy'

# Before disk encryption, and in the base-image build too: the container binds /var/lib/postgresql
# and GBrain's home with `chown postgres` / `chown gbrain`, so both accounts have to exist before it
# is mounted. Packages, the pinned binary and the (disabled) unit only; nothing of the org's.
- name: Include GBrain packages (Postgres, pgvector, the pinned binary)
  ansible.builtin.include_tasks: gbrain-packages.yml
  when: box_role == 'gbrain'

# Same reason, for the firewall: the container binds /var/lib/clickclack with `chown clickclack`.
# The pinned ClickClack binary, its account, its helper and its (disabled) unit; nothing of the org's.
- name: Include Team chat (ClickClack, installed and not enabled)
  ansible.builtin.include_tasks: teamchat.yml
  when: box_role == 'mitm'

# Encryption at rest, and it has to be HERE: everything below this line that writes a key writes it
# into a path that belongs inside the container (/opt/controlclaw/keys, the agent's home, the CA), so
# the container has to be open first. It runs after nodejs.yml because the container manager is a Node
# program, after user.yml because the bind mounts are owned by that account, and after
# firewall-linux.yml because it adds one UFW rule of its own.
#
# It also refuses to let the play continue on a box whose container did not open — see the assert in
# disk-encryption.yml, which is the difference between a locked box and a box that has silently
# regenerated its identity on the plain disk.
# A claimed pair keeps the pool mount ownership on subsequent full role updates.
- name: Check whether this box was prepared in the pool
  ansible.builtin.stat:
    path: /etc/controlclaw/pool-claimed
  register: cc_prepared_pool

- name: Include disk encryption (LUKS opened by the org's own boxes)
  ansible.builtin.include_tasks: disk-encryption.yml
  when:
    - disk_encryption | bool
    - box_role in ['openclaw', 'mitm', 'gbrain']
    - not ci_test

# Before the browser: the live browser is what makes a swapless 4 GB box a problem, and a box
# that has already started Chrome is a bad moment to be allocating a swap file.
- name: Prepare the unclaimed box identity inside its encrypted container
  ansible.builtin.include_tasks: pool-identity.yml
  when: pool_unclaimed | default(false) | bool

- name: Include swap tasks
  ansible.builtin.include_tasks: swap.yml
  when: swap_size_mb | int > 0 and box_role == 'openclaw' and not ci_test

- name: Include browser streaming tasks
  ansible.builtin.include_tasks: browser-stream.yml
  when: browser_stream_enabled | bool and box_role == 'openclaw'

# Egress wiring runs BEFORE the vm-agent starts: the agent's bootstrap reads the
# `keys/mitm_box_private_ip` marker written here to decide whether to wait for the mitm box, install
# its CA and enable the redirect before reporting ready. Starting the agent first let it report
# ready on an unconfined box, after which the control plane locked it down with no proxy path.
# The brain's egress goes through the firewall the same way (docs/plans/gbrain.md §6): the
# redirect, DNS, the CA and the boot-time restore are the same, and the file keeps OpenClaw's own
# pieces (its drop-ins, Chrome's trust store, cc-perm) to agents.
- name: Include OpenClaw egress wiring (route through the org mitm box)
  ansible.builtin.include_tasks: openclaw-egress.yml
  when:
    - box_role in ['openclaw', 'gbrain']
    - mitm_box_private_ip | default('') | length > 0

# Before the vm-agent: the agent may be handed a mount set the moment it comes up (the firewall
# re-pushes on /ready), and `sudo cc-drive-apply` has to exist by then. Inert until that push.
- name: Include Google Drive folder support (rclone, the mount units, cc-drive-apply)
  ansible.builtin.include_tasks: rclone.yml
  when: box_role == 'openclaw'

# Before the vm-agent, for the same reason rclone is: the firewall may push this box a Google grant
# the moment it comes up (it re-pushes on /ready), and `gog` plus its wrapper have to exist by then.
# Inert until that push — there is no credential here and nothing runs.
- name: Include the org Google account support (pinned gog + the wrapper it reads)
  ansible.builtin.include_tasks: gog.yml
  when: box_role == 'openclaw'

- name: Include VM agent tasks (OpenClaw box)
  ansible.builtin.include_tasks: vm-agent.yml
  when: vm_id is defined and box_role in ['openclaw', 'gbrain']

# The brain's database and GBrain itself, inside the container disk-encryption.yml has just opened.
- name: Include GBrain (the org's database and brain)
  ansible.builtin.include_tasks: gbrain.yml
  when: vm_id is defined and box_role == 'gbrain' and not ci_test

- name: Include OpenClaw gateway install (systemd unit the vm-agent drives)
  ansible.builtin.include_tasks: openclaw.yml
  when: vm_id is defined and box_role == 'openclaw'

- name: Include Caddy (TLS termination + auth shim in front of OpenClaw)
  ansible.builtin.include_tasks: caddy.yml
  # Firewall boxes too, since inbound webhooks arrive there and need a real certificate for the
  # org's firewall hostname (controlclaw docs/plans/webhooks.md). They get Caddyfile-mitm.j2,
  # which serves one path prefix and a bare 404 for everything else.
  #
  # NOT gated on vm_hostname. caddy.yml is written to be included without one: its header says
  # "the install half runs always (so the base image carries the package); the config half needs
  # vm_hostname", every config task inside it already carries `when: vm_hostname is defined`, and
  # it has a "Stop and disable Caddy until configured" task for exactly this case. Gating the
  # include here defeated all of that — a base-image build passes no hostname, so the image carried
  # no Caddy at all and every box installed it at boot. Real boxes always have a hostname, so this
  # changes nothing for them.
  when: box_role in ['openclaw', 'mitm', 'gbrain']

# The firewall's identity is checked HERE, before anything writes, and not only inside
# mitmbox.yml. self-update.yml runs first and rewrites /etc/controlclaw/update.conf, which is one
# of the two places org_id and controlclaw_url live; a re-run that was going to be refused would
# already have replaced them with empty strings by the time mitmbox.yml's own assert fired. A run
# that refuses to proceed must not destroy the values it is refusing to proceed without.
#
# The other copy is in KEYS_DIR, written by mitmbox.yml, which skips empty items — so with this
# assert in place a refused re-run leaves both copies intact.
#
# (`apt dist-upgrade` in playbooks/install.yml pre_tasks still runs ahead of this. It upgrades
# packages and touches nothing this box is identified by, so it is noise on a refused run rather
# than damage; moving the gate earlier would mean asserting in the shared playbook, where the
# role's defaults are not loaded yet.)
- name: Assert the mitm box knows who it is, before anything writes
  ansible.builtin.assert:
    that:
      - vm_id | default('') | length > 0
      - org_id | default('') | length > 0
      - controlclaw_url | default('') | length > 0
      - saas_public_key | default('') | length > 0
    fail_msg: >-
      box_role=mitm needs vm_id, org_id, controlclaw_url and saas_public_key. Refusing before the
      update pin is rewritten, so this box keeps both copies of the values it needs.
  when: box_role == 'mitm'

# Lets a later fix reach this box without rebuilding it. Pins what a re-run is allowed to pull,
# so the control plane can ask for an update but never choose the code.
#
# The firewall box needs this more than an agent does, not less: rebuilding it is the one
# operation that breaks every agent in the org (it nulls the keypair they pinned), so being able
# to fix it in place is what keeps that operation off the table. An in-place re-run keeps the
# keypair, the CA and the box key — all three are generated on the box behind existence guards.
- name: Include on-demand re-provisioning (pin + cc-reprovision)
  ansible.builtin.include_tasks: self-update.yml
  when: box_role in ['openclaw', 'mitm', 'gbrain']

# Rescue shell access on request (controlclaw PR #86, apps/saas/docs/features/shell-access.md):
# two root scripts, one sudoers line, a close-at-boot unit. Nothing opens until an owner grants it.
- name: Include rescue shell access tasks
  ansible.builtin.include_tasks: ssh-access.yml
  when: not ci_test and box_role in ['openclaw', 'mitm', 'gbrain']

# Last step of an agent box: starting the agent confines the box and reports ready, so every task
# that needs the open internet (npm above all) must already be done. See vm-agent-start.yml.
- name: Include the doctor SSH login
  ansible.builtin.include_tasks: doctor-agent.yml
  when: box_role == 'openclaw'

- name: Start the VM agent (confines the box and reports ready)
  ansible.builtin.include_tasks: vm-agent-start.yml
  when: vm_id is defined and box_role in ['openclaw', 'gbrain']

- name: Include proxy box tasks (blind L4 proxy)
  ansible.builtin.include_tasks: proxy.yml
  when: box_role == 'proxy'

- name: Include mitm box tasks (secret zone)
  ansible.builtin.include_tasks: mitmbox.yml
  when: box_role == 'mitm'

# The shared residential exit relay. No agent, no Docker, no customer data on it: one Node daemon
# and a certificate. See apps/saas/docs/features/residential-exit.md in the controlclaw repo.
- name: Include exit relay tasks (residential exit)
  ansible.builtin.include_tasks: exit-relay.yml
  when: box_role == 'exit-relay'

# Last on purpose: what release this box runs, written only once everything above succeeded.
- name: Record the installed release
  ansible.builtin.include_tasks: release.yml
  when: box_role in ['openclaw', 'mitm', 'gbrain']
